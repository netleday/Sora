[package]
name = "sora-setup"
version = "2.2.0"
authors = ["netleday"]
description = "Sora v2.2 Custom Setup"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
